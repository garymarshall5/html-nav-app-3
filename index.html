<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Watch Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 40vh; width: 100%; border-radius: 1rem; }
        .alert-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col gap-4">

    <header class="text-center">
        <h1 class="text-2xl font-bold text-blue-400">Anchor Watch</h1>
        <p id="status" class="text-sm text-gray-400">Status: Waiting for GPS...</p>
    </header>

    <div id="map" class="shadow-lg border border-gray-700"></div>

    <div class="bg-gray-800 p-4 rounded-xl flex flex-col gap-3">
        <div class="flex justify-between items-center">
            <label class="text-gray-300">Swing Radius (m):</label>
            <input type="number" id="radiusInput" value="50" class="bg-gray-700 w-20 p-2 rounded text-center">
        </div>
        <div id="anchorCoords" class="text-xs text-gray-500 italic text-center">Anchor not set</div>
        <div class="grid grid-cols-2 gap-2">
            <button id="startGpsBtn" class="bg-green-700 py-3 rounded-lg font-bold">Start GPS</button>
            <button id="audioUnlock" class="bg-yellow-600 py-3 rounded-lg font-bold">Unlock Audio</button>
            <button id="dropBtn" class="bg-blue-600 py-3 rounded-lg font-bold">Drop</button>
            <button id="stopBtn" class="bg-red-600 py-3 rounded-lg font-bold">Stop</button>
        </div>
        <button id="toggleMap" class="bg-indigo-700 py-2 rounded-lg font-bold text-xs">Toggle Nautical Map</button>
    </div>

    <div id="alarmPanel" class="hidden bg-red-900 border border-red-500 p-4 rounded-xl text-center alert-pulse space-y-2">
        <h2 class="text-xl font-bold">⚠️ DRAGGING ALERT!</h2>
    </div>

    <script>
        let map, anchorMarker, userMarker, swingCircle, anchorPos;
        let isFirstLoad = true;
        let audioCtx, oscillator;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        document.getElementById('audioUnlock').addEventListener('click', () => {
            initAudio();
            alert("Audio unlocked. Alarm will sound if dragging.");
        });

        function playAlarm() {
            if (!audioCtx) return;
            if (oscillator) return; 
            oscillator = audioCtx.createOscillator();
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
            oscillator.connect(audioCtx.destination);
            oscillator.start();
        }

        function stopAlarm() {
            if (oscillator) {
                oscillator.stop();
                oscillator = null;
            }
        }

        function updatePosition(pos) {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            
            document.getElementById('status').innerText = `Status: Monitoring (Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)})`;

            if (!userMarker) userMarker = L.marker([lat, lng]).addTo(map);
            else userMarker.setLatLng([lat, lng]);

            if (isFirstLoad) { 
                map.setView([lat, lng], 16); 
                isFirstLoad = false; 
            }

            if (anchorPos) {
                const dist = map.distance([lat, lng], anchorPos);
                if (dist > document.getElementById('radiusInput').value) {
                    document.getElementById('alarmPanel').classList.remove('hidden');
                    playAlarm();
                }
            }
        }

        document.getElementById('startGpsBtn').addEventListener('click', () => {
            if (navigator.geolocation) {
                document.getElementById('status').innerText = "Acquiring signal...";
                navigator.geolocation.watchPosition(updatePosition, (e) => {
                    document.getElementById('status').innerText = "Error: " + e.message;
                }, { enableHighAccuracy: true });
            } else {
                alert("Geolocation not supported.");
            }
        });

        document.getElementById('dropBtn').addEventListener('click', () => {
            if (!userMarker) { alert("Start GPS first!"); return; }
            anchorPos = userMarker.getLatLng();
            if (anchorMarker) map.removeLayer(anchorMarker);
            if (swingCircle) map.removeLayer(swingCircle);
            
            anchorMarker = L.marker(anchorPos, {icon: L.divIcon({html: '⚓', className: 'text-2xl'})}).addTo(map);
            swingCircle = L.circle(anchorPos, {radius: document.getElementById('radiusInput').value, color: 'red'}).addTo(map);
            document.getElementById('anchorCoords').innerText = `Anchor set: ${anchorPos.lat.toFixed(4)}, ${anchorPos.lng.toFixed(4)}`;
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            stopAlarm();
            anchorPos = null;
            location.reload();
        });

        document.getElementById('toggleMap').addEventListener('click', () => {
            let layers = map._layers;
            for (let i in layers) {
                if (layers[i]._url && layers[i]._url.includes('seamark')) {
                    map.removeLayer(layers[i]);
                    return;
                }
            }
            L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png').addTo(map);
        });

        window.onload = () => {
            map = L.map('map').setView([0, 0], 2);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        };
    </script>
</body>
</html>
