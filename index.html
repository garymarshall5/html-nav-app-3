<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Watch Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { background-color: #f1f5f9; font-family: 'Inter', sans-serif; }
        #map { height: 35vh; width: 100%; border-radius: 1.5rem; border: 1px solid rgba(0,0,0,0.1); }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(0,0,0,0.05); }
        .alert-pulse { animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0px rgba(220, 38, 38, 0); } 50% { box-shadow: 0 0 20px rgba(220, 38, 38, 0.4); } }
        .data-mono { font-family: 'Courier New', Courier, monospace; font-weight: 700; }
    </style>
</head>
<body id="body" class="text-slate-800 min-h-screen p-4 flex flex-col gap-3">

    <header class="text-center p-1">
        <h1 class="text-2xl font-black tracking-tighter text-blue-600 uppercase">Anchor Watch</h1>
        <div id="statusHeader" class="flex flex-col items-center gap-1 mt-2">
            <span id="posDisplay" class="text-blue-800 font-bold data-mono text-sm">GPS NEEDS TO BE INITIATED</span>
            <div class="flex justify-center gap-4 text-[10px] font-bold uppercase tracking-widest text-slate-500">
                <span id="powerStatus">--</span>
                <span id="status">--</span>
            </div>
        </div>
    </header>

    <div id="map" class="shadow-lg"></div>

    <div class="glass p-4 rounded-3xl flex flex-col gap-3 shadow-sm">
        <div class="flex justify-between items-center text-xs font-bold uppercase tracking-widest">
            <label class="text-slate-600">Radius (m)</label>
            <input type="number" id="radiusInput" value="50" class="bg-white w-16 p-2 rounded-xl text-center border border-slate-300">
        </div>
        
        <div id="anchorInfo" class="text-[10px] text-blue-700 text-center data-mono italic">ANCHOR NOT SET</div>

        <div class="flex justify-between items-center gap-2">
            <button id="notifyBtn" class="bg-purple-100 hover:bg-purple-200 px-4 py-2 rounded-lg text-[10px] font-bold uppercase text-purple-800">Enable Notif</button>
            <button id="audioInitBtn" class="bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg text-[10px] font-bold uppercase">Audio Init</button>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <button id="startGpsBtn" class="bg-blue-600 text-white py-3 rounded-2xl border border-blue-400 text-[10px] font-bold uppercase shadow-md">GPS Start</button>
            <button id="dropBtn" class="bg-emerald-600 text-white py-3 rounded-2xl border border-emerald-400 text-[10px] font-bold uppercase shadow-md">Drop Anchor</button>
            <button id="stopAlarmBtn" class="col-span-2 bg-red-600 text-white py-3 rounded-2xl border border-red-400 text-[10px] font-bold uppercase shadow-md">Stop Alarm & Disarm</button>
        </div>
    </div>

    <div id="alarmPanel" class="hidden bg-red-500 p-4 rounded-3xl text-center alert-pulse text-white shadow-lg">
        <h2 class="text-lg font-black italic uppercase" id="alarmText">Dragging Alert!</h2>
    </div>

    <script>
        let map, anchorMarker, userMarker, swingCircle, anchorPos, trail;
        let isArmed = false;
        let audioCtx, oscillator;

        document.getElementById('notifyBtn').onclick = () => {
            if (Notification.permission !== 'granted') {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') alert("Notifications enabled.");
                });
            }
        };

        function sendNotification(title, body) {
            if (Notification.permission === 'granted') {
                new Notification(title, { body: body, icon: 'https://cdn-icons-png.flaticon.com/512/3063/3063198.png' });
            }
        }

        document.getElementById('audioInitBtn').onclick = () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            alert("Audio system initialized.");
        };

        function playAlarm() {
            if (!audioCtx || oscillator) return;
            oscillator = audioCtx.createOscillator();
            oscillator.type = 'square';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
            oscillator.connect(audioCtx.destination);
            oscillator.start();
        }

        document.getElementById('stopAlarmBtn').onclick = () => {
            if (oscillator) { oscillator.stop(); oscillator = null; }
            isArmed = false;
            document.getElementById('alarmPanel').classList.add('hidden');
            document.getElementById('anchorInfo').innerText = "ANCHOR DISARMED";
        };

        function updatePosition(pos) {
            const currentPos = [pos.coords.latitude, pos.coords.longitude];
            document.getElementById('posDisplay').innerText = `POS: ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;

            if (!userMarker) {
                userMarker = L.marker(currentPos).addTo(map);
                trail = L.polyline([], {color: '#2563eb', weight: 3}).addTo(map);
                map.setView(currentPos, 16);
            } else {
                userMarker.setLatLng(currentPos);
            }
            trail.addLatLng(currentPos);

            if (isArmed && anchorPos) {
                const dist = map.distance(currentPos, anchorPos);
                const radius = document.getElementById('radiusInput').value;
                document.getElementById('anchorInfo').innerHTML = `DIST: ${Math.round(dist)}m / LIMIT: ${radius}m`;

                if (dist > radius) {
                    document.getElementById('alarmPanel').classList.remove('hidden');
                    document.getElementById('alarmText').innerText = "DRAGGING!";
                    sendNotification("ANCHOR DRAGGING!", "Boat has moved outside of radius.");
                    playAlarm();
                } else if (dist > radius * 0.8) {
                    document.getElementById('alarmPanel').classList.remove('hidden');
                    document.getElementById('alarmText').innerText = "WARNING: LIMIT APPROACHING";
                } else {
                    document.getElementById('alarmPanel').classList.add('hidden');
                }
            }
        }

        document.getElementById('startGpsBtn').onclick = () => navigator.geolocation.watchPosition(updatePosition, null, { enableHighAccuracy: true });
        document.getElementById('dropBtn').onclick = () => {
            if (!userMarker) return alert("Waiting for GPS...");
            anchorPos = userMarker.getLatLng();
            isArmed = true; 
            document.getElementById('anchorInfo').innerText = "ANCHOR ARMED";
        };

        window.onload = () => {
            map = L.map('map').setView([51.79, -0.65], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
        };
    </script>
</body>
</html>
