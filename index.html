<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Watch Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 60vh; width: 100%; border-radius: 1rem; }
        .alert-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col gap-4">

    <header class="text-center">
        <h1 class="text-2xl font-bold text-blue-400">Anchor Watch</h1>
        <p id="status" class="text-sm text-gray-400">Initializing GPS...</p>
    </header>

    <div id="map" class="shadow-lg border border-gray-700"></div>

    <div class="grid grid-cols-2 gap-4">
        <button id="dropBtn" class="bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold">Drop Anchor</button>
        <button id="toggleMap" class="bg-indigo-700 hover:bg-indigo-600 py-4 rounded-xl font-bold">Toggle Nautical</button>
        <button id="clearBtn" class="bg-gray-700 hover:bg-gray-600 py-4 rounded-xl font-bold col-span-2">Clear</button>
    </div>

    <div id="alarmPanel" class="hidden bg-red-900 border border-red-500 p-4 rounded-xl text-center alert-pulse">
        <h2 class="text-xl font-bold">⚠️ DRAGGING ALERT!</h2>
        <p id="distDisplay"></p>
    </div>

    <script>
        let map, anchorMarker, userMarker, swingCircle, anchorPos;
        let radius = 50; // meters
        let isNautical = false;
        let baseLayer, nauticalLayer;

        function initMap() {
            map = L.map('map').setView([51.505, -0.09], 15);
            
            baseLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
            nauticalLayer = L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png');
            
            baseLayer.addTo(map);
            
            navigator.geolocation.watchPosition(updatePosition, console.error, { enableHighAccuracy: true });
        }

        document.getElementById('toggleMap').addEventListener('click', () => {
            isNautical = !isNautical;
            if (isNautical) {
                nauticalLayer.addTo(map);
            } else {
                map.removeLayer(nauticalLayer);
            }
        });

        function updatePosition(pos) {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            if (!userMarker) {
                userMarker = L.marker([lat, lng]).addTo(map).bindPopup("You");
            } else {
                userMarker.setLatLng([lat, lng]);
            }
            map.setView([lat, lng]);

            if (anchorPos) {
                const dist = map.distance([lat, lng], anchorPos);
                document.getElementById('status').innerText = `Drift: ${Math.round(dist)}m (Radius: ${radius}m)`;
                
                if (dist > radius) {
                    document.getElementById('alarmPanel').classList.remove('hidden');
                    document.getElementById('distDisplay').innerText = `Moved ${Math.round(dist - radius)}m outside limit!`;
                }
            }
        }

        document.getElementById('dropBtn').addEventListener('click', () => {
            if (userMarker) {
                anchorPos = userMarker.getLatLng();
                if (anchorMarker) map.removeLayer(anchorMarker);
                if (swingCircle) map.removeLayer(swingCircle);
                
                anchorMarker = L.marker(anchorPos, {icon: L.divIcon({html: '⚓', className: 'text-2xl'})}).addTo(map);
                swingCircle = L.circle(anchorPos, {radius: radius, color: 'red'}).addTo(map);
                document.getElementById('status').innerText = "Anchor Set";
            }
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            anchorPos = null;
            if (anchorMarker) map.removeLayer(anchorMarker);
            if (swingCircle) map.removeLayer(swingCircle);
            document.getElementById('alarmPanel').classList.add('hidden');
            document.getElementById('status').innerText = "Monitoring...";
        });

        window.onload = initMap;
    </script>
</body>
</html>
